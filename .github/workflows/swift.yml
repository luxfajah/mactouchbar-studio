name: Mac App CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build MacTouchBar Beta App
        run: |
          chmod +x mac-app-beta/build_beta.sh
          ./mac-app-beta/build_beta.sh

